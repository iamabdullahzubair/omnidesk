services:
  db:
    image: postgres:16-alpine
    container_name: omnidesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: support_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d support_chat"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnidesk-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://admin:admin123@db:5432/support_chat
      JWT_SECRET: super_secret_jwt_key_change_in_production_minimum_32_characters_long
      JWT_EXPIRES_IN: 7d
      AGENT_EMAIL: agent@support.com
      AGENT_INITIAL_PASSWORD: AgentPassword123!
      AGENT_NAME: "Alex Support"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnidesk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
